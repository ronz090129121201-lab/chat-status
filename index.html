<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Status</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#071b18;
  color:white;
  font-family:Arial,sans-serif;
}

.card{
  width:100%;
  max-width:390px;
  background:#102b26;
  border:1px solid #245448;
  border-radius:22px;
  padding:30px 22px;
  text-align:center;
  box-shadow:0 15px 50px #0008;
}

.logo{
  width:65px;
  height:65px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#16876a;
  font-size:30px;
}

h1{font-size:25px;margin:20px 0 8px}

p{
  color:#b9d2ca;
  line-height:1.6;
}

button{
  background:#20bd91;
  color:#06251d;
  border:0;
  border-radius:12px;
  padding:15px 35px;
  font-weight:bold;
  font-size:16px;
  margin-top:20px;
  cursor:pointer;
}

#loading,#result{display:none}

.bar{
  height:9px;
  background:#29483e;
  border-radius:20px;
  overflow:hidden;
  margin-top:25px;
}

.progress{
  height:100%;
  width:0;
  background:#20d39a;
  transition:width 15s linear;
}

#status{
  min-height:28px;
  font-size:15px;
}

.notice{
  margin-top:30px;
  font-size:10px;
  color:#8da79e;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">◉</div>

<h1>Chat Status</h1>

<p id="intro">Sedia untuk memulakan pemeriksaan?</p>

<div id="start">
<button onclick="startCheck()">MULA</button>
</div>

<div id="loading">
<p id="status">Menghubungkan...</p>
<div class="bar">
<div class="progress" id="progress"></div>
</div>
</div>

<div id="result">
<h2>😂 Terkena!</h2>
<p>Pemeriksaan telah selesai.</p>
<button onclick="location.reload()">KEMBALI</button>
</div>

<div class="notice">
Halaman hiburan tidak rasmi. Tidak mengakses atau mengubah akaun WhatsApp.
</div>

</div>

<script>
function startCheck(){

document.getElementById("intro").style.display="none";
document.getElementById("start").style.display="none";
document.getElementById("loading").style.display="block";

let messages=[
"Menghubungkan...",
"Menyemak status...",
"Menganalisis maklumat...",
"Pemeriksaan hampir selesai...",
"Menyelesaikan proses..."
];

let status=document.getElementById("status");
let progress=document.getElementById("progress");

progress.style.width="100%";

messages.forEach((message,index)=>{
setTimeout(()=>{
status.textContent=message;
},index*3000);
});

setTimeout(()=>{
document.getElementById("loading").style.display="none";
document.getElementById("result").style.display="block";
},15000);

}
</script>

</body>
</html>
