<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAT STATUS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #11191d;
    color: white;
    font-family: Consolas, monospace;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0 12px 30px;
    overflow-x: hidden;
}

.main {
    width: min(680px, calc(100vw - 36px));
    min-height: 720px;
    margin-top: 0;
    padding: 20px 22px 40px;
    border-left: 2px solid #b5ff68;
    border-right: 2px solid #b5ff68;
    border-bottom: 2px solid #b5ff68;
    background: #080b0c;
    box-shadow:
        0 0 12px #aaff60,
        inset 0 0 15px #243c20;
    position: relative;
    overflow: hidden;
}

.logo {
    width: 100px;
    height: 100px;
    display: block;
    margin: 0 auto 8px;
    filter: drop-shadow(0 0 12px #8aff00);
}

.brand {
    text-align: center;
    color: #b6ff64;
    font-size: 27px;
    letter-spacing: 3px;
    margin-bottom: 38px;
    text-shadow: 0 0 10px #8aff00;
}

h1 {
    text-align: center;
    font-size: clamp(30px, 5vw, 48px);
    margin: 0 0 30px;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 8px #fff;
}

.required {
    text-align: center;
    color: #ff806b;
    font-weight: bold;
    font-size: 19px;
    letter-spacing: 6px;
    margin-bottom: 32px;
}

.description {
    text-align: center;
    color: #e5eeee;
    font-size: 15px;
    line-height: 2;
    font-weight: bold;
    margin-bottom: 30px;
}

.timer {
    text-align: center;
    font-size: 68px;
    font-weight: bold;
    color: #d5ffb0;
    text-shadow: 0 0 20px #65ff00;
    margin: 20px 0 28px;
}

.progress {
    height: 15px;
    border: 2px solid #dce9e9;
    background: #111;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, red, orange, #aaff00);
    box-shadow: 0 0 12px #aaff00;
    transition: width .3s linear;
}

.percent {
    text-align: right;
    margin-top: 10px;
    color: #d7ffb4;
    font-size: 16px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 22px;
    background: #10240e;
    border: 1px solid #aaff66;
    color: #caff9c;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 4px;
    cursor: pointer;
    box-shadow: 0 0 10px #7dff36;
}

button:active {
