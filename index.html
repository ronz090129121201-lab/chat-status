<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Status</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:#020806;
 color:#00ff75;
 font-family:monospace;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.card{
 width:100%;
 max-width:430px;
 background:#030d09;
 border:1px solid #00ff75;
 padding:25px;
 box-shadow:0 0 25px #00ff7540;
}

h1{
 text-align:center;
 letter-spacing:4px;
 text-shadow:0 0 12px #00ff75;
}

.subtitle{
 text-align:center;
 color:#70ffad;
 font-size:12px;
}

button{
 width:100%;
 padding:15px;
 margin-top:25px;
 background:#00ff75;
 border:0;
 color:#001b0b;
 font-weight:bold;
 font-size:16px;
 cursor:pointer;
}

#terminal{
 display:none;
 height:250px;
 overflow:hidden;
 border:1px solid #075c32;
 padding:12px;
 font-size:12px;
 line-height:1.8;
}

.line{
 animation:flash .25s infinite alternate;
}

@keyframes flash{
 from{opacity:.5}
 to{opacity:1}
}

.bar{
 height:12px;
 background:#092719;
 margin-top:20px;
}

.progress{
 height:100%;
 width:0;
 background:#00ff75;
 box-shadow:0 0 15px #00ff75;
 transition:width 20s linear;
}

#percent{
 text-align:right;
 margin-top:8px;
}

#result{
 display:none;
 text-align:center;
}

</style>
</head>

<body>

<div class="card">

<h1>CHAT STATUS</h1>
<p class="subtitle">DIGITAL INTERFACE</p>

<div id="start">
<button onclick="startSystem()">INITIALIZE</button>
</div>

<div id="terminal"></div>

<div class="bar">
<div class="progress" id="progress"></div>
</div>

<div id="percent">0%</div>

<div id="result">
<h2>PROCESS COMPLETE</h2>
<p>😂 Terkena!</p>
<button onclick="location.reload()">RESTART</button>
</div>

</div>

<script>

let messages=[
"> Initializing interface...",
"> Establishing visual connection...",
"> Loading digital modules...",
"> Scanning demo environment...",
"> Analyzing simulated data...",
"> Running security animation...",
"> Synchronizing interface...",
"> Finalizing process..."
];

function startSystem(){

document.getElementById("start").style.display="none";

let terminal=document.getElementById("terminal");
let progress=document.getElementById("progress");
let percent=document.getElementById("percent");

terminal.style.display="block";

let start=Date.now();

let interval=setInterval(()=>{

let elapsed=Date.now()-start;
let value=Math.min(100,Math.floor(elapsed/20000*100));

percent.textContent=value+"%";

let random=Math.floor(Math.random()*messages.length);

let line=document.createElement("div");
line.className="line";
line.textContent=messages[random];

terminal.appendChild(line);

while(terminal.children.length>10){
terminal.removeChild(terminal.firstChild);
}

if(value>=100){
clearInterval(interval);
terminal.style.display="none";
percent.style.display="none";
document.getElementById("result").style.display="block";
}

},250);

progress.style.width="100%";

}

</script>

</body>
</html>
