<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAT STATUS</title>

<style>
*{box-sizing:border-box}

:root{
 --green:#00ff73;
 --red:#ff3038;
}

body{
 margin:0;
 min-height:100vh;
 padding:20px 12px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#010402;
 color:white;
 font-family:Arial,sans-serif;
 overflow-x:hidden;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 pointer-events:none;
 background:
 repeating-linear-gradient(
  0deg,
  transparent 0 3px,
  rgba(0,255,90,.08) 4px,
  transparent 5px 8px
 ),
 radial-gradient(
  ellipse at center,
  rgba(0,255,80,.12),
  transparent 65%
 );
}

.frame{
 width:min(100%,900px);
 position:relative;
 padding:26px 22px 20px;
 border:3px solid var(--green);
 border-radius:18px;
 box-shadow:
  0 0 12px var(--green),
  inset 0 0 22px rgba(0,255,100,.18);
 background:rgba(0,8,3,.96);
 text-align:center;
}

.frame:before,
.frame:after{
 content:"";
 position:absolute;
 left:0;
 right:0;
 height:12px;
 background:repeating-linear-gradient(
  120deg,
  var(--green) 0 22px,
  transparent 22px 40px,
  var(--red) 40px 62px,
  transparent 62px 80px
 );
}

.frame:before{top:-3px}
.frame:after{bottom:-3px}

/* WHATSAPP LOGO */
.logo{
 width:85px;
 height:85px;
 margin:0 auto 8px;
 filter:drop-shadow(0 0 12px #00ff73);
}

.logo svg{
 width:100%;
 height:100%;
}

.brand{
 font-size:25px;
 font-weight:800;
 color:var(--green);
 text-shadow:0 0 12px var(--green);
}

h1{
 margin:6px 0 2px;
 font-size:clamp(38px,8vw,62px);
 letter-spacing:7px;
 color:var(--green);
 text-shadow:0 0 12px var(--green);
}

.status{
 color:var(--red);
 font-size:clamp(17px,4vw,25px);
 font-weight:900;
 letter-spacing:7px;
 margin:6px 0;
}

.desc{
 font-size:clamp(14px,3vw,21px);
 color:var(--green);
 margin:8px 0;
}

.counter{
 font-size:clamp(50px,10vw,72px);
 font-weight:900;
 color:var(--red);
 text-shadow:0 0 18px var(--red);
 margin:4px 0;
}

.progress-wrap{
 height:24px;
 border:3px solid var(--green);
 border-radius:9px;
 padding:3px;
 box-shadow:0 0 10px rgba(0,255,100,.4);
}

.progress{
 height:100%;
 width:0%;
 border-radius:4px;
 background:linear-gradient(
  90deg,
  red,
  #ffb000,
  var(--green)
 );
 transition:width .25s linear;
}

.percent{
 font-size:22px;
 margin:8px 0 12px;
}

label{
 display:block;
 color:var(--red);
 font-size:clamp(19px,4vw,28px);
 font-weight:900;
 margin:14px 0 10px;
 text-shadow:0 0 10px var(--red);
}

input{
 width:100%;
 max-width:720px;
 padding:17px 14px;
 border:3px solid var(--green);
 border-radius:12px;
 background:#001006;
 color:white;
 font-size:25px;
 text-align:center;
 outline:none;
}

button{
 display:block;
 margin:18px auto 14px;
 padding:12px 45px;
 border:3px solid var(--green);
 border-radius:12px;
 background:#001b0b;
 color:var(--green);
 font-size:24px;
 font-weight:900;
 letter-spacing:3px;
 cursor:pointer;
 box-shadow:0 0 13px rgba(0,255,100,.4);
}

button:disabled,
input:disabled{
 opacity:.55;
}

.terminal{
 margin-top:14px;
 padding:10px 14px;
 border:2px solid #00b94d;
 border-radius:4px;
 color:#00ff73;
 text-align:left;
 font-family:monospace;
 font-size:clamp(12px,2.5vw,17px);
 line-height:1.5;
 min-height:110px;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 text-shadow:0 0 7px #00ff73;
}

.hidden{display:none!important}

.error-mode{
 animation:flash .22s steps(2,end) infinite;
}

.error-mode .frame{
 border-color:var(--red);
 box-shadow:
  0 0 18px var(--red),
  inset 0 0 28px rgba(255,0,0,.24);
}

.error-mode h1,
.error-mode .logo,
.error-mode .brand{
 color:var(--red);
 text-shadow:0 0 16px var(--red);
}

.error-mode .status,
.error-mode .desc{
 color:white;
}

.shake{
 animation:shake .12s linear 8;
}

.glitch{
 animation:glitch .18s steps(2,end) 8;
}

@keyframes flash{
 50%{filter:hue-rotate(95deg) brightness(1.5)}
}

@keyframes shake{
 0%,100%{transform:translate(0,0)}
 25%{transform:translate(-7px,2px)}
 50%{transform:translate(6px,-2px)}
 75%{transform:translate(-4px,-1px)}
}

@keyframes glitch{
 0%{transform:translate(0)}
 25%{transform:translate(3px,-2px)}
 50%{transform:translate(-3px,2px)}
 75%{transform:translate(2px,1px)}
}

@media(max-width:520px){
 .frame{padding:22px 13px 16px}
 .status{letter-spacing:4px}
 .terminal{font-size:11px}
 input{font-size:19px}
}
</style>
</head>

<body>

<main class="frame" id="panel">

 <!-- LOGO WHATSAPP -->
 <div class="logo">
  <svg viewBox="0 0 100 100"
       xmlns="http://www.w3.org/2000/svg">
   <path
    fill="#25D366"
    d="M50 5C25.1 5 5 25.1 5 50c0 8.2 2.2 16.2 6.4 23.2L5 95l22.4-6.1C34.1 93 42 95 50 95c24.9 0 45-20.1 45-45S74.9 5 50 5z"/>
   <path
    fill="#fff"
    d="M73.4 62.7c-1.2 3.5-6 6.4-9.9 7.2-2.6.5-6 .9-17.4-3.8-14.6-6-24-20.8-24.7-21.7-.7-.9-5.9-7.9-5.9-15 0-7.1 3.7-10.6 5.2-12.1 1.3-1.4 3.4-2 5.4-2h1.8c1.6 0 2.4.1 3.5 2.7 1.3 3.1 4.5 11 4.9 11.8.4.8.7 1.7.1 2.7-.5 1-1 1.6-1.8 2.5-.8.9-1.7 2-2.4 2.7-.8.8-1.6 1.7-.7 3.3.9 1.6 4.1 6.7 8.8 10.8 6 5.3 11.1 7 12.7 7.8 1.6.8 2.5.7 3.4-.4.9-1.1 3.9-4.5 4.9-6.1 1-1.6 2-1.3 3.4-.8 1.4.5 9.1 4.3 10.7 5.1 1.6.8 2.7 1.2 3.1 1.9.4.7.4 4-.8 7.4z"
    transform="translate(15 14) scale(.75)"/>
  </svg>
 </div>

 <div class="brand">CHAT INTERFACE</div>

 <h1>CHAT STATUS</h1>

 <div class="status" id="status">
 • INPUT REQUIRED •
 </div>

 <p class="desc" id="desc">
 Pemeriksaan visual sedang menunggu input untuk meneruskan paparan.
 </p>

 <div class="counter" id="counter">30</div>

 <div class="progress-wrap">
  <div class="progress" id="progress"></div>
 </div>

 <div class="percent" id="percent">0%</div>

 <section id="inputArea" class="hidden">

  <label for="phoneInput">
   MASUKKAN NOMOR TELEFON
  </label>

  <input
   id="phoneInput"
   type="tel"
   inputmode="numeric"
   autocomplete="off"
  >

  <button id="continueBtn">
   TERUSKAN
  </button>

 </section>

 <div class="terminal" id="terminal">
&gt; WAITING FOR START COMMAND...
&gt; CHECKING INTERFACE...
&gt; SCANNING VISUAL ELEMENTS...
&gt; SIGNAL STATUS: STANDBY
&gt; WAITING FOR INPUT
 </div>

 <div
  id="final"
  class="hidden"
  style="
   font-size:clamp(30px,7vw,54px);
   font-weight:900;
   color:#ff3038;
   text-shadow:0 0 16px red;
   margin-top:18px;
  "
 >
  APA KAU TUNGGU?!
 </div>

</main>

<script>
const $=id=>document.getElementById(id);

const counter=$('counter');
const progress=$('progress');
const percent=$('percent');
const input=$('phoneInput');
const button=$('continueBtn');
const terminal=$('terminal');

let elapsed=0;
let errorShown=false;
let started=false;

function log(line){
 terminal.textContent+="\n> "+line;
 terminal.scrollTop=terminal.scrollHeight;
}

let audioCtx;

function beep(freq=620,duration=.12,type='square',volume=.035){
 try{
  audioCtx=audioCtx||new(
   window.AudioContext||
   window.webkitAudioContext
  )();

  if(audioCtx.state==='suspended'){
   audioCtx.resume();
  }

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;
  gain.gain.value=volume;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  gain.gain.exponentialRampToValueAtTime(
   .001,
   audioCtx.currentTime+duration
  );

  osc.stop(audioCtx.currentTime+duration);

 }catch(e){}
}

function alarm(){
 let n=0;

 const a=setInterval(()=>{
  beep(n%2?880:420,.16,'sawtooth',.045);
  n++;

  if(n>=10){
   clearInterval(a);
  }
 },210);
}

function showError(message){

 if(errorShown)return;

 errorShown=true;

 document.body.classList.add(
  'error-mode',
  'shake'
 );

 $('status').textContent='• SYSTEM ERROR •';
 $('desc').textContent=message;

 $('panel').classList.add('glitch');

 log('WARNING: VISUAL ERROR DETECTED');
 log('RETRY STATUS: ATTENTION REQUIRED');

 alarm();

 if(navigator.vibrate){
  navigator.vibrate([120,60,120,60,220]);
 }

 setTimeout(()=>{
  document.body.classList.remove('shake');
 },1200);
}

button.addEventListener('click',()=>{

 const digits=input.value.replace(/\D/g,'');

 if(digits.length<7||digits.length>15){

  showError(
   'Format input tidak sah. Sila semak semula nombor yang dimasukkan.'
  );

  log('INPUT FORMAT: INVALID');
  return;
 }

 input.disabled=true;
 button.disabled=true;

 log('INPUT FORMAT: ACCEPTED LOCALLY');
 log('CONTINUING VISUAL SEQUENCE...');

 beep(740,.2,'triangle');

});

function start(){

 if(started)return;

 started=true;

 log('PROCESS STARTED');

 const timer=setInterval(()=>{

  elapsed++;

  const remaining=Math.max(0,30-elapsed);

  counter.textContent=remaining;

  const p=Math.min(
   100,
   Math.round(elapsed/30*100)
  );

  progress.style.width=p+'%';
  percent.textContent=p+'%';

  if(elapsed===10){

   $('inputArea').classList.remove('hidden');

   log('INPUT PANEL READY');
  }

  if(elapsed%4===0){
   beep(500+Math.random()*300,.07,'square',.018);
  }

  if(elapsed===18&&!errorShown){
   log('WARNING: SIGNAL UNSTABLE');
  }

  if(elapsed>=30){

   clearInterval(timer);

   if(!errorShown){
    showError(
     'Sambungan visual terganggu. Urutan paparan telah tamat.'
    );
   }

   $('final').classList.remove('hidden');

   log('VISUAL SEQUENCE COMPLETE');

   beep(980,.35,'sawtooth',.05);
  }

 },1000);
}

start();
</script>

</body>
</html>
